# Opportunity graveyard — ideas evmax already tested and did not ship.
#
# The opportunity-scout workflow (docs/opportunity-workflow-scope.md) reads this
# file at gate G0. A candidate that matches an entry is rejected UNLESS it cites
# new evidence that meets the entry's `revisit_if` condition.
#
# Append with:  python scripts/opportunity_ledger.py graveyard-add ...
# (append-only; the workflow never rewrites existing entries).
#
# Fields
#   id          stable kebab-case key
#   idea        what was proposed, one or two sentences
#   lever       model | pricing | execution | coverage | venue | data | reliability | sizing
#   sectors     list of sector keys, or [all]
#   verdict     REJECTED        walk-forward / CLV test failed
#               REFUTED         the premise itself was disproved
#               DONT_BUILD      evaluated, not worth building
#               UNDERPOWERED    tested, inconclusive; revisit when the sample grows
#               NOT_SUPPORTABLE data access or agent policy blocks it
#               PARKED          already built inert / default-off; needs CLV to promote — do not rebuild
#               POLICY          owner decision
#   date        verdict date (YYYY-MM-DD), null when not recorded
#   evidence    where the numbers live (doc, PR, script, CLAUDE.md section)
#   revisit_if  the specific new evidence that would justify a re-proposal

- id: elo-h2h-layer
  idea: Elo head-to-head adjustment read through resolved team keys.
  lever: model
  sectors: [nba, baseball, nhl, ncaab]
  verdict: REJECTED
  date: 2026-09-23
  evidence: "docs/elo-h2h-rest-eval.md; PR #330. Worse in every sector: NBA +1.46/1000 (z +4.8), baseball +1.00 (z +5.8), NHL +0.78 (z +2.7), NCAAB +0.55 (z +5.0)."
  revisit_if: A different H2H formulation with a walk-forward blend win in at least two sectors. Removing the raw-label H2H that still fires is a separate open decision, not a new opportunity.

