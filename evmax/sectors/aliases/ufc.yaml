# UFC fighter name aliases.
#
# Two naming systems must collapse to ONE canonical form per fighter:
#   - Kalshi (KXUFCFIGHT): the "Will X win" clause carries the full name,
#     but the "{A} vs {B}" clause carries EITHER surnames or full names
#     (both observed live 2026-07-11: "Saint-Denis vs Pimblett" but
#     "Conor McGregor vs Max Holloway").
#   - Pinnacle (sport 22, league name "UFC"): full names.
#
# Because one venue may emit a bare surname while the other emits the full
# name, the canonical is the SURNAME (the tennis convention): the handler
# tries this alias map first, then falls back to the LAST WORD of the name
# ("Conor McGregor" → "mcgregor"; hyphenated surnames survive as one token,
# "Benoit Saint-Denis" → "saint-denis"). Only names the last-word rule gets
# WRONG need an entry here:
#
#   1. East-Asian family-name-first order — the last-word rule picks the
#      GIVEN name when a source writes family-name-first. Alias both orders
#      to the family name.
#   2. Nickname / spelling variants that must land on the same surname.
#
# Keys are the cleaned lowercase form (NameNormalizer strips punctuation
# before lookup). Add entries when the scan log shows a match_failed for a
# UFC bout — same maintenance loop as the tennis/worldcup alias maps.

aliases:
  # -- East-Asian name order (family name first in one source or the other) --
  "zhang weili": "zhang"
  "weili zhang": "zhang"
  "yan xiaonan": "yan"
  "xiaonan yan": "yan"
  "song yadong": "song"
  "yadong song": "song"
  "wang cong": "wang"
  "cong wang": "wang"
  "park jun yong": "park"
  "jun yong park": "park"
  # -- Nickname / spelling variants --
  "izzy adesanya": "adesanya"
  "connor mcgregor": "mcgregor"
  "do bronx oliveira": "oliveira"
  "jonathan jones": "jones"
  "alexandre pereira": "pereira"
  "volkanovski": "volkanovski"
  # -- "Last word is not the usual book surname" cases --
  # Pinnacle/Kalshi list "Ian Machado Garry" — last word already "garry",
  # but the short form "Ian Garry" appears in some feeds; both collapse fine
  # via the last-word rule, listed here only as documentation examples.
