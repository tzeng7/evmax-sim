aliases:
  # NHL team-name aliases → ONE canonical per team.
  #
  # Canonical = the lowercased full team name, which is exactly what the
  # seeded Elo / form / nhl_xg state is keyed by (ESPN display names) and what
  # Pinnacle's full names normalize to. The ONE exception is St. Louis:
  # the canonical is the DOT-FREE "st louis blues", because the Pinnacle
  # client strips "." from its event keys (esports_pinnacle._normalize) while
  # the Kalshi-side key builder does not, so a dotted canonical could never
  # exact-match an STL spread/total record (moneyline only survived via fuzzy).
  #
  # Sources the map must cover (verified against archive.db, 2026-09-22):
  #   - Kalshi ticker codes: 3-letter, plus the 2-letter LA / NJ / SJ / TB
  #     (KXNHLGAME-26SEP19VGKLA-LA). Kalshi's codes are NOT the NHL tricodes
  #     for those four teams (LAK / NJD / SJS / TBL), so both forms map.
  #   - Kalshi title city labels ("Los Angeles", "St. Louis", "New York R",
  #     "New York I") — the totals-title fallback path parses these.
  #   - Pinnacle full names ("Utah Mammoth", "Montreal Canadiens").
  #   - ESPN display names (resolution + model feed), incl. "Montréal".
  # The Rangers / Islanders pair shares a city, so bare "new york" / "ny" is
  # deliberately NOT mapped — it cannot be resolved to one team.

  # --- Full names --------------------------------------------------------
