  # Utah's franchise played 2024-25 as "Utah Hockey Club" before the
  # 2025-26 "Utah Mammoth" rebrand (still Utah Mammoth for 2026-27). The
  # normalizer strips the noise word "club", so "utah hockey" is the form
  # that actually reaches the lookup. The deactivated Arizona Coyotes are
  # NOT aliased — they are not this team's rating history.
  "utah hockey club": "utah mammoth"
  "utah hockey": "utah mammoth"
  "utah hc": "utah mammoth"

