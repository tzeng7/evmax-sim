  - team: storm
    delta: 10
    reason: "Added Katie Lou Samuelson"
  - team: storm
    delta: 10
    reason: "Dominique Malonga Y2 development bump"

  # -------- Valkyries (net +5) --------
  - team: valkyries
    delta: 5
    reason: "Y2 continuity and cohesion bump"

  # -------- Sparks (net +75) --------
  - team: sparks
    delta: 50
    reason: "Acquired Kelsey Plum from Las Vegas Aces"
  - team: sparks
    delta: 25
    reason: "Acquired Ariel Atkins from Washington Mystics"

