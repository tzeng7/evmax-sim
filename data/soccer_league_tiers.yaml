# Soccer league tier config — drives per-league `sharp_weight` overrides in the
# ensemble blend. Rationale: walk-forward on 2,606 games (2024-2026) showed
# that in top-5 European leagues, Pinnacle's closing Brier is the informational
# ceiling (~0.1981–0.2097) and our stat blend drags it by 0.003–0.007 when
# mixed in at the default sharp_weight=0.40. In those markets the stat models
# are pure dead weight on calibration.
#
# The edge comes from Kalshi-vs-Pinnacle price deviations, not from our models
# beating Pinnacle. So for top-tier leagues we want to bet cheap Pinnacle
# imitation; for thinner leagues where Pinnacle is less adversarial, keep the
# default blend.
#
# Fallback: tickers not matching any tier use the `default_sharp_weight`.
#
# Tiers are keyed by canonical LEAGUE (evmax/sectors/soccer_leagues.py), which
# is venue-agnostic: Kalshi markets resolve their league from the ticker series
# prefix, Polymarket US markets from the league slug they were fetched under.
# (Before 2026-09-05 the lookup was ticker-only, so every PolyUS soccer market
# — which has no Kalshi ticker — silently fell to the MLS default of 0.40.)
# A `kalshi_series:` list is still accepted and mapped through
# KALSHI_SERIES_LEAGUE; when Kalshi adds a soccer series, add it to
# SECTOR_SERIES_MAP + KALSHI_SERIES_LEAGUE and to a tier here.
#
# Optional per-tier `disagreement_ramp: {threshold, saturate_at, cap}` replaces
# the SECTOR-level ramp in EnsembleModelAgent.DISAGREEMENT_OVERRIDES["soccer"]
# for that tier's events. A tier WITHOUT one inherits the sector ramp
# (0.04 / 0.10 / 1.00), which was calibrated on pooled top-5 + UEFA data
# (n=4406, 2324–2526, MLS unseeded at the time). Set an MLS-specific ramp only
# from an MLS-only per-bucket walk-forward (scripts/per_bucket_disagreement_perf.py).

default_sharp_weight: 0.40

tiers:
  top_tier:
    # Top-5 European leagues + UEFA competitions. Pinnacle is ceiling here.
    # sharp_weight=0.85 keeps a 15% model contribution as a regularizer — the
    # disagreement bump will push higher on wide gaps.
    sharp_weight: 0.85
    # Identical to the sector-level soccer ramp — stated explicitly so the
    # per-league plumbing is exercised without changing today's blend.
    disagreement_ramp: {threshold: 0.04, saturate_at: 0.10, cap: 1.00}
    leagues:
      - epl               # English Premier League   (KXEPLGAME / PolyUS epl)
      - laliga            # La Liga                  (KXLALIGAGAME / lal)
      - bundesliga        # Bundesliga               (KXBUNDESLIGAGAME / bun)
      - seriea            # Serie A                  (KXSERIEAGAME / sea)
      - ligue1            # Ligue 1                  (KXLIGUE1GAME)
      - ucl               # UEFA Champions League    (KXUCLGAME / ucl)
      - uel               # UEFA Europa League       (KXUELGAME / uefa)

  secondary:
    # Less liquid, less adversarial. Our models might actually help here, so
    # keep the default blend.
    sharp_weight: 0.40
    # NO disagreement_ramp: inherits the sector ramp — by EVIDENCE, not by
    # omission. The MLS-only walk-forward (scripts/mls_disagreement_ramp.py,
    # docs/mls-disagreement-ramp-eval.md, 2026-09-05) found the close is the
    # ceiling on MLS too: flat 0.40 with no ramp is +13.8/1000 3-way Brier
    # WORSE than sharp-only on the 2026 holdout (z 2.9), the inherited ramp is
    # within noise of sharp, and no swept ramp beats it outside noise. The
    # "models might help here" rationale above is therefore unsupported on
    # close-Brier; the 0.40 base survives only because the ramp caps it. Judge
    # any base-weight change on `cleanup shadow clv-leagues soccer` (CLV),
    # never on Brier.
    leagues:
      - mls               # Major League Soccer      (KXMLSGAME / PolyUS mls)
