# Betting category registry — the single source of truth for what evmax can
# bet on, which models run for each category, what state each is in, and
# whether the scanner should run it live, in shadow mode, or skip it.
#
# Schema per category:
#   display_name     : human-readable name shown in CLI output and CLAUDE.md
#   market_types     : list of MarketType enum values the sector produces
#                      (moneyline / spread / total / map_handicap /
#                      series_winner / player_prop / other). For prop
#                      categories this is always [player_prop]; the per-stat
#                      taxonomy lives in prop_stat_types.
#   prop_stat_types  : (optional) list of stat-level names — only populated
#                      for prop categories (e.g. [points, rebounds, assists]
#                      for nba_props). Null / absent for game categories.
#   models           : list of model names that actually contribute
#                      (confidence > 0) for this sector. Models wired in
#                      the ensemble but gated out per-sector are OMITTED —
#                      this list reflects live contribution, not registration.
#   mode             : one of "live" | "shadow" | "disabled"
#                        live     → scanner produces EVGaps, persists with
#                                   mode='live', sizes Kelly against bankroll
#                        shadow   → scanner produces predictions, persists
#                                   with mode='shadow', DOES NOT touch bankroll
#                        disabled → scanner skips the category entirely
#   resolver         : where outcome resolution reads from
#   status           : one of "shipped" | "wip" | "unresolved" | "blocked"
#   season_window    : (optional) {start: "MM-DD", end: "MM-DD"} inclusive
#                      regular-season bounds; wraps the year boundary when
#                      end < start (e.g. NFL). Omitted = year-round. The
#                      coordinator drops out-of-season sectors on default
#                      scans (saves Kalshi/Pinnacle rate-limit tokens);
#                      explicit --sectors bypasses the gate.
#   notes            : (optional) free-text caveats, TODO.md cross-references
#
# Validation (evmax/categories.py::validate_registry):
#   - every key in evmax/clients/kalshi.py::SECTOR_SERIES_MAP must have an entry
#   - every `market_types` value must be in MarketType enum
#   - every `models` name must exist in KNOWN_MODELS
#   - every `mode` value must be in {live, shadow, disabled}
#   - every `resolver` value must be in KNOWN_RESOLVERS
#   - every `status` value must be in {shipped, wip, unresolved, blocked}
#   - prop_stat_types must be non-null iff `market_types == [player_prop]`

# ===========================================================================
# Game-level categories
# ===========================================================================

nba:
  display_name: "NBA"
  market_types: [moneyline, spread, total]
  models: [elo, form, efficiency, shot_quality, matchup, possession_sim, sharp]
  mode: live
  resolver: espn_scoreboard
  status: shipped
  notes: null

nfl:
  display_name: "NFL"
  market_types: [moneyline, spread, total]
  shadow_market_types: [spread, total]
  models: [elo, form, nfl_efficiency, nfl_qb_elo, sharp]
  mode: live
  resolver: espn_scoreboard
  status: shipped
  season_window: {start: "09-04", end: "02-15"}
  notes: "Poisson dropped 2026-05-01: NFL is not a Poisson-distributed scoring process. Replaced by nfl_efficiency (opponent-adjusted EPA/play) and nfl_qb_elo (team Elo split into team_base + per-QB delta to capture starter swaps), both seeded weekly from nflreadpy PBP — see MODEL-13. 2026-09-03: spread + total opened in shadow_market_types for the 2026 season — no NFL row has ever been logged in this system, KXNFLSPREAD was wired only 2026-08-01, and every NFL spread/total prediction is sharp-only (no model prices them), i.e. pure Kalshi-vs-Pinnacle divergence — the same shape that lost baseball totals −15% ROI and bled WNBA spread-take −2.2pp CLV. Promote per side via `cleanup shadow clv nfl -m spread --side lay|take` once n>=30 with CLV>=0, never pooled. Moneyline stays live."

ncaab:
  display_name: "NCAAB (Men's College Basketball)"
  market_types: [moneyline, spread, total]
  models: [elo, form, ncaab_efficiency, ncaab_possession_sim, sharp]
  mode: live
  resolver: espn_scoreboard
  status: shipped
  season_window: {start: "11-01", end: "04-10"}
  notes: "2026-07-11: opponent-adjusted efficiency stack added (ncaab_efficiency + ncaab_possession_sim; KenPom-style log-LS solver in evmax/agents/models/_college_efficiency.py, seeded by scripts/seed_ncaab_efficiency.py --league mens, weekly in season). The stale `poisson` entry was removed the same day — the agent had been soccer/worldcup-gated since 2026-06-01, so the effective blend was just elo+form. Walk-forward validation (scripts/backtest_ncaab_efficiency.py, weights + shrink_k + score_stdev swept on 2024-25 ONLY, frozen, then held out on 2025-26): NEW blend (eff .60 / sim .20 / elo .10 / form .10) holdout Brier 0.1911 / Acc 70.2% vs OLD elo+form 0.2038 / 68.4% (ΔBrier +0.0127, n=4878); efficiency standalone 0.1917 beats every incumbent. Elo/form floored at 0.10 deliberately: the staleness guard darkens the efficiency stack every November until the current-season re-seed reaches MIN_GAMES=4/team, and the floors keep an elo+form fallback in the blend. NOVEMBER OPS: re-seed weekly from opening night (the guard silences prior-season ratings in-season — the WNBA +24pp chalk-bias lesson). Recommend a fresh shadow-CLV check (cleanup shadow clv ncaab) over the first weeks of 2026-27 before trusting the new blend live."

ncaaw:
  display_name: "NCAAW (Women's College Basketball)"
  market_types: [moneyline, spread, total]
  models: [elo, form, ncaaw_efficiency, ncaaw_possession_sim, sharp]
  mode: live
  resolver: espn_scoreboard
  status: shipped
  season_window: {start: "11-01", end: "04-10"}
  notes: "2026-07-11: opponent-adjusted efficiency stack added (ncaaw_efficiency + ncaaw_possession_sim — own state file + constants, shares only the college math core with ncaab; seeded by scripts/seed_ncaab_efficiency.py --league womens, weekly in season) AND the NCAAW half of MODEL-2 shipped: elo now runs calibrated K=35 / HOME_ADVANTAGE_ELO=80 (swept on 2024-25, validated on 2025-26 — elo standalone holdout Brier 0.1767 vs 0.1873 on the old uncalibrated NBA defaults). Walk-forward validation (scripts/backtest_ncaab_efficiency.py --league womens, all choices swept on 2024-25 ONLY, frozen, held out on 2025-26): NEW blend (eff .60 / sim .20 / elo .10 / form .10) holdout Brier 0.1608 / Acc 75.5% vs the de-facto elo+form blend 0.1861 / 73.1% and the previously-documented form-only blend 0.1942 / 70.8% (n=4731); efficiency standalone 0.1602 beats every incumbent. NOVEMBER OPS: re-seed weekly from opening night (staleness guard silences prior-season ratings in-season; blend falls back to elo+form+sharp until MIN_GAMES=4/team). Recommend a fresh shadow-CLV check (cleanup shadow clv ncaaw) over the first weeks of 2026-27 before trusting the new blend live. NHL half of MODEL-2 still open."

ncaaf:
  display_name: "NCAAF (FBS College Football)"
  market_types: [moneyline, spread, total]
  disabled_market_types: [spread, total]
  models: [elo, form, ncaaf_efficiency_v2, sharp]
  mode: shadow
  resolver: espn_scoreboard
  status: wip
  season_window: {start: "08-23", end: "01-21"}
  notes: "Added 2026-08-01 (shadow). Kalshi series KXNCAAFGAME (moneyline; verified live 2026-08-01) + KXNCAAFSPREAD/KXNCAAFTOTAL (series exist, populate near kickoff). Pinnacle sport_id 15 league 880 ('NCAA'). Resolver espn_scoreboard reads the college-football scoreboard with groups=80 (FBS only). In _US_SECTORS (ET game-day convention) so late-night West-coast kickoffs with next-day-UTC Pinnacle timestamps land on the Kalshi ticker's ET calendar day. Alias map evmax/sectors/aliases/ncaaf.yaml is GENERATED by scripts/build_ncaaf_aliases.py (walks a past FBS season, ~230 schools; curated ambiguity guards for Miami FL/OH, USC vs South Carolina, Ole Miss, App State, accented San José State). Kalshi per-market ticker outcome codes are added by hand during the first live scan of the season (MLS/Torino precedent) — until then unmatched teams demote to shadow via the MIN_NONSHARP_MODELS guard. PHASE 1 (this change): wiring only — blend is elo+form+sharp; spread/total disabled pending capture. PHASE 2 adds ncaaf_efficiency (opponent-adjusted EPA/play with an embedded preseason-prior → in-season ramp w(gp)=gp/(gp+k), the CFB-critical shrinkage the market leans on for weeks 0–3) and CFB-calibrated generic Elo. Promote via `evmax cleanup shadow promote ncaaf` once n>=30 resolved with CLV>=0. Moneyline first; spread is CFB's liquid product but the anchored-entry/CLV capture machinery needs accrued snapshots first (WNBA spread precedent). MODEL-2 (2026-08-07): generic elo is now CFB-CALIBRATED K=40 / HOME_ADVANTAGE_ELO=60 (swept via scripts/backtest_ncaaf_elo.py, cold-start walk-forward held out on 2025 n=958 — holdout Brier 0.1836 vs 0.2057 for the old silent K=20/home_adv=0 fallback, Δ+0.0221; the zero-CFB-home-edge bug). The constants start inert: ncaaf elo begins the season UNSEEDED (no elo_state.json key), so elo+form sit gated (confidence 0.30) and the early-season blend is ncaaf_efficiency + sharp. As of #169 the resolve-time model-update hook DOES feed ncaaf, so elo warms automatically over ~5 games/team and then predicts with these constants; a walk-forward warm-seed (week-0 start) is the only remaining activation step — see MODEL-2 in TODO.md. **v2 (2026-09-03):** `ncaaf_efficiency` → `ncaaf_efficiency_v2` — margin = 35·Δnet-EPA + 70·Δnet-success-rate + 3.5 home, prior = 50/50 regressed prior-season EPA + PRESEASON ESPN FPI (evmax/clients/cfb_fpi.py; frozen on the season's first seed). Held-out Brier v1→v2 2023 0.1920→0.1853, 2024 0.1946→0.1897, 2025 0.1917→0.1849 (constants fit on 2024 only; scripts/backtest_ncaaf_v2.py). In the 85%-sharp blend the gain is ≤0.4/1000 — the value is CLV-shaped (open→close slope +0.07→+0.11), so judge promotion on `cleanup shadow clv ncaaf`, not Brier. Contamination rule dates v1-token rows out of the clean sample. Rejected in the same ablation: explosiveness, pass/rush split, turnover split, special teams, rest/bye, tempo, hetero-σ, 2-season prior, market-implied prior, and ESPN win-prob garbage filter (+15/1000 WORSE — WP embeds the pregame FPI prior)."

soccer:
  display_name: "Soccer (EPL, UCL, La Liga, Bundesliga, Serie A, Ligue 1, MLS, UEL)"
  market_types: [moneyline, total]
  models: [elo, form, poisson, xg, sharp]
  mode: live
  resolver: espn_scoreboard
  status: shipped
  notes: "Draw markets handled as separate TIE outcomes. MLS + UEL resolution added in PR #1."

worldcup:
  display_name: "World Cup (national teams)"
  market_types: [moneyline, advance]
  models: [elo, form, poisson, xg, sharp]
  mode: disabled
  resolver: espn_scoreboard
  status: wip
  season_window: {start: "06-11", end: "07-19"}
  notes: "Added 2026-06-14 for the 2026 World Cup. Kalshi series KXWCGAME (3-way: TeamA/TeamB/TIE); Pinnacle league 2686 (FIFA - World Cup), auto-3-way-devigged off the draw price. SEPARATE sector from `soccer`: its own Elo namespace (data/models/elo_state.json['worldcup'], K=40, HOME_ADVANTAGE_ELO=0 for neutral venues), its own alias map (evmax/sectors/aliases/worldcup.yaml — FIFA 3-letter codes + Pinnacle/ESPN name variants → one canonical/nation). 2026-06-14: blend now MIRRORS soccer — poisson 0.40 · xg 0.25 · elo 0.15 · form 0.10 (sharp via sharp_weight) — but every model reads its OWN national-team namespace, never the club `soccer` pool. The two advanced metrics carry over because the stats exist for national teams: Poisson off international goals (poisson_state['worldcup'], symmetric neutral-venue league avg 1.30/1.30 since HOME_ADVANTAGE=0), xG off ESPN shotsOnTarget/totalShots (soccer_xg_state['worldcup']). National-team Elo is still the genuinely new model: club ratings are meaningless for national sides. Seed all four via scripts/seed_national_team_elo.py (Elo) + scripts/seed_worldcup_advanced.py (poisson + xg + form), both walk-forward over ESPN international results. Form fires only when a team has a fresh (<60d) record — most teams will once group play starts. Starts SHADOW: validates live wiring (KXWCGAME matching, 2686 devig, draw handling, fifa.world resolution) + national-team model edge before any bankroll. Moneyline only — WC spread/total series exist (KXWCSPREAD/KXWCTOTAL) but stale-line totals on a night-before workflow are a known trap (see baseball notes). Promote via `evmax cleanup shadow promote worldcup` once n>=30 resolved with CLV >= 0. 2026-07-05: knockout ADVANCE coverage added — Kalshi KXWCADVANCE (2-way 'Team X advances', winner incl. ET/pens; one YES market per team). Pinnacle has NO live per-match advance market (its 'To Reach X' specials cut off at the team's PREVIOUS kickoff and never reopen — verified: 'Mexico To Reach QF' served pre-R32 prices on R16 matchday), so BOTH the sharp anchor and the model prob are derived from the same game's regulation 3-way via derive_advance_prob (evmax/ev/devig.py): P(adv) = p_win + p_draw*(0.55*r + 0.45*0.5) with r = p_win/(p_win+p_opp) — ET keeps the favorite's edge, pens are a coin flip; 0.55 calibrated against Kalshi's liquid advance mids (6-game check: 2.0pp mean abs error vs 3.4pp for the pure ratio). Matched via ::advance event-key suffix so advance and regulation records can never cross-match (MatchingEngine filters the candidate pool by suffix). Resolution uses the ESPN competitor winner flag (covers pens); the same change fixed regulation TIE/ML resolution for AET/pens knockout games (STATUS_FINAL_AET/_PEN => regulation was a draw)."

tennis:
  display_name: "Tennis (ATP + WTA)"
  market_types: [moneyline]
  models: [tennis_surface_elo, tennis_serve_return, tennis_h2h, tennis_ranking_trend, tennis_form, tennis_advanced, sharp]
  mode: live
  resolver: kalshi_settlement
  status: shipped
  notes: "Shadow 2026-05-01 → 2026-05-02: production data (n=112) initially pushed sharp_weight to 1.00, but a leak-free walk-forward (n=2576, 2025+2026, scripts/backtest_tennis_walkforward.py) showed flat 0.85 beats sharp_only by ΔBrier +0.40/1000 — the production sample was selection-biased (EV≥2% YES rows only). Reverted to 0.85 with no disagreement-ramp override; tennis_h2h alone beats sharp by 0.0077 Brier on its 863-game subset, which the ramp was wiping out. Watch n=30+ resolved shadow bets to confirm before promoting back to live via `evmax cleanup shadow promote tennis`. 2026-06-10: full-blend gate added — gaps missing any of surface/serve_return/form/advanced in model_sources are demoted to shadow per-row (REQUIRED_BLEND_MODELS in ev_gap_agent.py); ranking_trend reworked to log-rank + momentum. 2026-06-27: ranking_trend re-sourced to pure Tennis Abstract — seeded from matchmx winner/loser rank columns by scripts/seed_tennis_models.py (full-replace); the Sackmann reseed + ESPN fallback scripts were deleted."

baseball:
  display_name: "Baseball (MLB)"
  market_types: [moneyline, spread, total]
  disabled_market_types: [total]
  models: [elo, form, pitcher_v2, sharp]
  mode: shadow
  resolver: espn_scoreboard
  status: shipped
  season_window: {start: "03-20", end: "11-05"}
  notes: "Pitcher Pythag model live (BUG-9 fixed in PR #2). Poisson dropped 2026-05-01: never earned its keep on MLB runs (overdispersion + bullpen-leverage violates independence). Pitcher promoted to 0.50 within model side via SECTOR_WEIGHT_OVERRIDES. Demoted to shadow 2026-05-10 pending Brier-vs-Kalshi validation. shadow_market_types: [total] is declared ahead-of-time: when ML/spread eventually clear n≥75 with positive CLV, flipping `mode: live` keeps totals in shadow automatically (no-op while base mode is shadow). Totals enabled 2026-05-22 (c91d50b) showed −41.9% ROI on n=13 with no measurable CLV until the 2026-05-26 totals close-prob fix. 2026-06-01: totals CLV capture finally wired end-to-end (resolver/capture/sweep now dispatch market_type=='total' to get_total_closing_line_aligned) + NO-side UNDER evaluation added (Kalshi frames totals YES=OVER, so unders were structurally unbettable before). Result on n=27 resolved: over-side CLV −2.9pp (7/27 beat close). Root cause is NOT model bias — totals are pure sharp devig (blended==sharp) and the over-bias is stale-line noise + selection: our night-before Pinnacle snapshot is noisy, the EV filter selects the upward noise, and it reverts by close. The archive shows ZERO systematic open→close total drift (950 events: −0.5pp), so there's no exploitable under-side drift and no valid −5pp shade. Night-before-only scan workflow can't support totals (apparent edge 2–4% < ~5pp noise; can't re-scan late). Moneyline by contrast is +2.9pp CLV with 0.3pp scan→close drift. Totals left in shadow as-is per user 2026-06-01 (revisit; leading candidate is to disable baseball totals). 2026-06-10: totals DISABLED via disabled_market_types — the NO-side UNDER stream resolved n=102 (scans 06-01→06-06, run from the alt-runline feature branch): hit 59.8% vs predicted 71.2%, −15.2% flat-stake ROI, blended 8.7pp above Pinnacle close. Over side was +18% ROI (n=76) but also +5.4pp above close — same stale-line selection, lucky side. Confirms the 06-01 diagnosis at 4× the sample; night-before workflow cannot support totals. Re-enable only with a near-close re-scan workflow."

wnba:
  display_name: "WNBA"
  market_types: [moneyline, spread, total]
  models: [elo, form, wnba_efficiency, wnba_possession_sim, sharp]
  mode: live
  disabled_market_types: [spread, total]
  resolver: espn_scoreboard
  status: wip
  notes: "Promoted 2026-05-26 — ML live. Efficiency seeded from 2025 ESPN box scores (scripts/seed_wnba_efficiency.py); Poisson zeroed in ensemble since basketball is not a Poisson process. SPREAD/TOTAL OWNERSHIP MOVED TO THE ANCHORED-ENTRY TRIGGER 2026-07-19: the scanner's scan-time entry (median ~23h post-listing, post-convergence) was the wrong entry point for laddered markets — its shadow stream failed the CLV gate at every sample size (lay n=33 +0.18pp/30%). The Kalshi candlestick backfill (scripts/backfill_kalshi_candles.py + eval_wnba_anchored_backfill.py, 2026-07-19) validated FIRST-ANCHORED-SWEEP entry instead: spread lay +1.32pp mean Kalshi CLV over 116 declustered games (p<0.001, falsification-clean); spread take KILLED (n=106 games, -0.10pp); totals underpowered (n=26/32 games, under negative). spread+total are disabled_market_types so the scanner can't freeze market_ids at scan prices (ev_predictions is UNIQUE(market_id), first insert wins) — `cleanup watch-listings --log-entries` logs the anchored-entry shadow stream instead (model_sources '+anchored_entry', crossable order-book prices, EV>=2pp + depth>=$50). Judge promotion with `cleanup shadow clv wnba -m spread --side lay --venue kalshi --sources-token anchored_entry` once the live stream confirms the backfill (game-declustered n>=30). ML unaffected (live, Brier-gated)."

nhl:
  display_name: "NHL"
  market_types: [moneyline, spread, total]
  models: [form, nhl_xg, sharp]
  mode: shadow
  resolver: espn_scoreboard
  status: shipped
  notes: "Shadow 2026-05-02: nhl_xg agent landed (MoneyPuck 5v5 xGF/60 + xGA/60 → projected goal margin → Φ via GOAL_STDEV=2.05, HOME_EDGE_GOALS=0.18). Ensemble override gives nhl_xg 0.30, form 0.15, sharp via sharp_weight (0.85 default). Elo K-factor still uncalibrated for NHL (see MODEL-2 / SECTOR-1) — kept out of NHL ensemble for now. Goalie GSAx + special teams + B2B fatigue layers tracked in TODO.md as v2/v3. Promote to live once shadow Brier validates against sharp baseline (~0.225)."

lol:
