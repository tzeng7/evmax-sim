  mode: shadow
  resolver: espn_boxscore
  status: blocked
  season_window: {start: "09-04", end: "02-15"}
  notes: "Stage 4 backtest shipped (PR #6) — QB-only NO-side ROI +79% at ev>=3% vol>=1000. Live betting blocked on MODEL-9 (shadow validation against pre-game prices). 2026-09-02 season-start audit: flipped disabled -> shadow so the MODEL-9 shadow clock starts Week 1 (the 2026-08-08 disable was a Pinnacle-geo-block workaround, not a model verdict). The Kalshi series are real (KXNFLPASSYDS/RSHYDS/RECYDS/ANYTD/PASSTDS/REC, 396 open Week-1 markets) and Pinnacle props are now priced off the bulk /sports/15/markets/straight index because the per-special endpoint is geo-blocked from the US. nflverse publishes the season's weekly-stats parquet only after Week 1, so early-September props ride the prior season's history (the cache skips an unpublished season instead of failing)."

