# Betting category registry — the single source of truth for what evmax can
# bet on, which models run for each category, what state each is in, and
# whether the scanner should run it live, in shadow mode, or skip it.
#
# Schema per category:
#   display_name     : human-readable name shown in CLI output and CLAUDE.md
#   market_types     : list of MarketType enum values the sector produces
#                      (moneyline / spread / total / map_handicap /
#                      series_winner / player_prop / other). For prop
#                      categories this is always [player_prop]; the per-stat
#                      taxonomy lives in prop_stat_types.
#   prop_stat_types  : (optional) list of stat-level names — only populated
#                      for prop categories (e.g. [points, rebounds, assists]
#                      for nba_props). Null / absent for game categories.
#   models           : list of model names that actually contribute
#                      (confidence > 0) for this sector. Models wired in
#                      the ensemble but gated out per-sector are OMITTED —
#                      this list reflects live contribution, not registration.
#   mode             : one of "live" | "shadow" | "disabled"
#                        live     → scanner produces EVGaps, persists with
#                                   mode='live', sizes Kelly against bankroll
#                        shadow   → scanner produces predictions, persists
#                                   with mode='shadow', DOES NOT touch bankroll
#                        disabled → scanner skips the category entirely
#   resolver         : where outcome resolution reads from
#   status           : one of "shipped" | "wip" | "unresolved" | "blocked"
#   notes            : (optional) free-text caveats, TODO.md cross-references
#
# Validation (evmax/categories.py::validate_registry):
#   - every key in evmax/clients/kalshi.py::SECTOR_SERIES_MAP must have an entry
#   - every `market_types` value must be in MarketType enum
#   - every `models` name must exist in KNOWN_MODELS
#   - every `mode` value must be in {live, shadow, disabled}
#   - every `resolver` value must be in KNOWN_RESOLVERS
#   - every `status` value must be in {shipped, wip, unresolved, blocked}
#   - prop_stat_types must be non-null iff `market_types == [player_prop]`

# ===========================================================================
# Game-level categories
# ===========================================================================

nba:
  display_name: "NBA"
  market_types: [moneyline, spread, total]
  models: [elo, form, efficiency, shot_quality, matchup, possession_sim, sharp]
  mode: live
  resolver: espn_scoreboard
  status: shipped
  notes: null

nfl:
  display_name: "NFL"
  market_types: [moneyline, spread, total]
  models: [elo, form, nfl_efficiency, nfl_qb_elo, sharp]
  mode: live
  resolver: espn_scoreboard
  status: shipped
  notes: "Poisson dropped 2026-05-01: NFL is not a Poisson-distributed scoring process. Replaced by nfl_efficiency (opponent-adjusted EPA/play) and nfl_qb_elo (team Elo split into team_base + per-QB delta to capture starter swaps), both seeded weekly from nflreadpy PBP — see MODEL-13."

ncaab:
  display_name: "NCAAB (Men's College Basketball)"
  market_types: [moneyline, spread, total]
  models: [elo, form, poisson, sharp]
  mode: live
  resolver: espn_scoreboard
  status: shipped
  notes: null

ncaaw:
  display_name: "NCAAW (Women's College Basketball)"
  market_types: [moneyline, spread, total]
  models: [form, sharp]
  mode: live
  resolver: espn_scoreboard
  status: shipped
  notes: "Elo K-factor and home-advantage not calibrated for NCAAW — see MODEL-2 / SECTOR-2. Elo contributes 0 until then."

soccer:
  display_name: "Soccer (EPL, UCL, La Liga, Bundesliga, Serie A, Ligue 1, MLS, UEL)"
  market_types: [moneyline, total]
  models: [elo, form, poisson, sharp]
  mode: live
  resolver: espn_scoreboard
  status: shipped
  notes: "Draw markets handled as separate TIE outcomes. MLS + UEL resolution added in PR #1."

tennis:
  display_name: "Tennis (ATP + WTA)"
  market_types: [moneyline]
  models: [tennis_surface_elo, tennis_serve_return, tennis_h2h, tennis_ranking_trend, tennis_form, tennis_advanced, sharp]
  mode: live
  resolver: kalshi_settlement
  status: shipped
  notes: "Shadow 2026-05-01 → 2026-05-02: production data (n=112) initially pushed sharp_weight to 1.00, but a leak-free walk-forward (n=2576, 2025+2026, scripts/backtest_tennis_walkforward.py) showed flat 0.85 beats sharp_only by ΔBrier +0.40/1000 — the production sample was selection-biased (EV≥2% YES rows only). Reverted to 0.85 with no disagreement-ramp override; tennis_h2h alone beats sharp by 0.0077 Brier on its 863-game subset, which the ramp was wiping out. Watch n=30+ resolved shadow bets to confirm before promoting back to live via `evmax cleanup shadow promote tennis`."

baseball:
  display_name: "Baseball (MLB)"
  market_types: [moneyline, spread, total]
  shadow_market_types: [total]
  models: [elo, form, pitcher, sharp]
  mode: shadow
  resolver: espn_scoreboard
  status: shipped
  notes: "Pitcher Pythag model live (BUG-9 fixed in PR #2). Poisson dropped 2026-05-01: never earned its keep on MLB runs (overdispersion + bullpen-leverage violates independence). Pitcher promoted to 0.50 within model side via SECTOR_WEIGHT_OVERRIDES. Demoted to shadow 2026-05-10 pending Brier-vs-Kalshi validation. shadow_market_types: [total] is declared ahead-of-time: when ML/spread eventually clear n≥75 with positive CLV, flipping `mode: live` keeps totals in shadow automatically (no-op while base mode is shadow). Totals enabled 2026-05-22 (c91d50b) showed −41.9% ROI on n=13 with no measurable CLV until the 2026-05-26 totals close-prob fix. 2026-06-01: totals CLV capture finally wired end-to-end (resolver/capture/sweep now dispatch market_type=='total' to get_total_closing_line_aligned) + NO-side UNDER evaluation added (Kalshi frames totals YES=OVER, so unders were structurally unbettable before). Result on n=27 resolved: over-side CLV −2.9pp (7/27 beat close). Root cause is NOT model bias — totals are pure sharp devig (blended==sharp) and the over-bias is stale-line noise + selection: our night-before Pinnacle snapshot is noisy, the EV filter selects the upward noise, and it reverts by close. The archive shows ZERO systematic open→close total drift (950 events: −0.5pp), so there's no exploitable under-side drift and no valid −5pp shade. Night-before-only scan workflow can't support totals (apparent edge 2–4% < ~5pp noise; can't re-scan late). Moneyline by contrast is +2.9pp CLV with 0.3pp scan→close drift. Totals left in shadow as-is per user 2026-06-01 (revisit; leading candidate is to disable baseball totals)."

wnba:
  display_name: "WNBA"
  market_types: [moneyline, spread, total]
  models: [elo, form, wnba_efficiency, wnba_possession_sim, sharp]
  mode: live
  shadow_market_types: [total]
  resolver: espn_scoreboard
  status: wip
  notes: "Promoted 2026-05-26 — ML and spread live, total kept in shadow until ~30 resolved bets (wnba_possession_sim totals output is newer to live). Efficiency seeded from 2025 ESPN box scores (scripts/seed_wnba_efficiency.py); Poisson zeroed in ensemble since basketball is not a Poisson process."

nhl:
  display_name: "NHL"
  market_types: [moneyline, spread, total]
  models: [form, nhl_xg, sharp]
  mode: shadow
  resolver: espn_scoreboard
  status: shipped
  notes: "Shadow 2026-05-02: nhl_xg agent landed (MoneyPuck 5v5 xGF/60 + xGA/60 → projected goal margin → Φ via GOAL_STDEV=2.05, HOME_EDGE_GOALS=0.18). Ensemble override gives nhl_xg 0.30, form 0.15, sharp via sharp_weight (0.85 default). Elo K-factor still uncalibrated for NHL (see MODEL-2 / SECTOR-1) — kept out of NHL ensemble for now. Goalie GSAx + special teams + B2B fatigue layers tracked in TODO.md as v2/v3. Promote to live once shadow Brier validates against sharp baseline (~0.225)."

lol:
  display_name: "League of Legends"
  market_types: [moneyline, map_handicap]
  models: [sharp]
  mode: shadow
  resolver: bo3gg
  status: shipped
  notes: "Shadow 2026-05-06: all esports demoted pending validation. sharp_weight bumped to 1.00 in model_config.json — predictions are pure sharp. Elo/form gated out (esports rosters churn too fast for team-level Elo to track real strength; Pinnacle prices in roster moves immediately)."

cs2:
  display_name: "CS2"
  market_types: [moneyline, map_handicap]
  models: [sharp]
  mode: shadow
  resolver: bo3gg
  status: shipped
  notes: "Shadow 2026-05-06: all esports demoted pending validation. sharp_weight bumped to 1.00 in model_config.json — predictions are pure sharp. Elo/form gated out (esports rosters churn too fast for team-level Elo to track real strength; Pinnacle prices in roster moves immediately)."

# Valorant, UFC, F1 are in evmax/sectors/registry.py (latent sector handlers
# with Elo K-factors wired in) but are NOT in kalshi.py::SECTOR_SERIES_MAP —
# there is no Kalshi product for them, so they cannot currently be bet on
# even though the infrastructure would support them if markets appeared.
# Do not add them to this registry until Kalshi ships matching series and
# they get wired into SECTOR_SERIES_MAP. The validator enforces this by
# failing fast if the two lists drift apart.

# ===========================================================================
# Player-prop categories
# ===========================================================================

nba_props:
  display_name: "NBA player props"
  market_types: [player_prop]
  prop_stat_types: [points, rebounds, assists, threes, steals, blocks, points_rebounds_assists]
  models: [nba_props_cache]
  mode: shadow
  resolver: espn_boxscore
  status: shipped
  notes: "Demoted to shadow 2026-05-01: 2026-04-09→2026-05-01 actionable (ev>=2%) hit rate 15.3% vs model 25.6%, unit PnL -223u over 575 resolved bets, Brier 0.109 vs Kalshi 0.096 (worse than market). Largest leak in ev>=10% bucket (12.1% hit vs 25.0% predicted). Daily L15 game log cache at data/nba_props_cache.json; per-36-min normalization + opponent adjustment + streak/margin blends — root cause investigation pending."

nfl_props:
  display_name: "NFL player props"
  market_types: [player_prop]
  prop_stat_types: [passing_yards, rushing_yards, receiving_yards, passing_tds, receptions, anytime_td]
  models: [nfl_props_cache_v1_qb_only]
  mode: shadow
  resolver: espn_boxscore
  status: blocked
  notes: "Stage 4 backtest shipped (PR #6) — QB-only NO-side ROI +79% at ev>=3% vol>=1000. Live betting blocked on MODEL-9 (shadow validation against pre-game prices). kalshi.py SECTOR_SERIES_MAP still has phantom series names (KXNFLPAS etc.); the fix ships with MODEL-9 so no NFL prop markets are fetched in scan today."
