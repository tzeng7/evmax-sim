  display_name: "NBA player props"
  market_types: [player_prop]
  prop_stat_types: [points, rebounds, assists, threes, steals, blocks, points_rebounds_assists]
  models: [nba_props_cache]
  mode: disabled
  resolver: espn_boxscore
  status: shipped
  notes: "Demoted to shadow 2026-05-01: 2026-04-09→2026-05-01 actionable (ev>=2%) hit rate 15.3% vs model 25.6%, unit PnL -223u over 575 resolved bets, Brier 0.109 vs Kalshi 0.096 (worse than market). Largest leak in ev>=10% bucket (12.1% hit vs 25.0% predicted). Daily L15 game log cache at data/nba_props_cache.json; per-36-min normalization + opponent adjustment + streak/margin blends — root cause investigation pending."

nfl_props:
  display_name: "NFL player props"
  market_types: [player_prop]
