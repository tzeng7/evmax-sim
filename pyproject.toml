[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evmax"
version = "0.1.0"
description = "EV maximizer for Kalshi/Polymarket prediction markets"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "rich>=13.7",
    "scipy>=1.13",
    "numpy>=1.26",
    "rapidfuzz>=3.8",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "greenlet>=3.0",
    "openpyxl>=3.1",
    "questionary>=2.0",
    "websockets>=12.0",
    "nba_api>=1.4",
    "nflreadpy>=0.1.5",
    "pandas>=2.0",
    "aiolimiter>=1.1",
    "cryptography>=46.0.6",
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "jinja2>=3.1.6",
    "pyarrow>=15.0",
]

[project.scripts]
evmax = "evmax.cli.app:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "httpx>=0.27",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
