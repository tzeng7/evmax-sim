# Scheduled canary: watch Kalshi's published fee schedule for drift.
#
# Kalshi has no numeric fee API — the authoritative taker/maker rates live in a
# dated PDF (kalshi.com/docs/kalshi-fee-schedule.pdf) that our trading math
# hard-codes in evmax/fees.py. This job fetches that PDF weekly, extracts the
# coefficients + effective date + a normalized-text hash, and diffs them against
# data/kalshi_fee_schedule.snapshot.json AND the live fees.py constants.
#
# Deliberately SEPARATE from ci.yml: it touches the network, so it must never
# gate a PR. On drift it fails, alerts the webhook(s), and opens/updates an
# issue. A fetch/parse failure (429, format change) is INCONCLUSIVE — a warning,
# not a false fee alarm.
#
# Security posture (mirrors ci.yml): actions pinned to a full SHA,
# persist-credentials:false, least-privilege token. The PDF-derived summary is
# passed to shell steps via env vars, never interpolated into `run:` bodies, so
# external document text cannot inject commands.

name: Kalshi fee watch

on:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: kalshi-fee-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Watch Kalshi fee schedule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.17"
          python-version: "3.13"
          enable-cache: true

      - name: Check Kalshi fee schedule
        id: check
        continue-on-error: true # the explicit "Fail on drift" step gates the job
        run: uv run --with 'pypdf==6.15.0' python scripts/check_kalshi_fees.py

      - name: Notify webhooks on drift
        if: steps.check.outputs.verdict == 'hard_drift' || steps.check.outputs.verdict == 'soft_drift'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python scripts/check_kalshi_fees.py --notify-file kalshi-fee-result.json

      - name: Open or update drift issue
        if: steps.check.outputs.verdict == 'hard_drift' || steps.check.outputs.verdict == 'soft_drift'
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.check.outputs.verdict }}
          SUMMARY: ${{ steps.check.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Kalshi fee schedule drift detected"
          {
            echo "The scheduled fee watch flagged **${VERDICT}**."
            echo ""
            echo "> ${SUMMARY}"
            echo ""
            echo "**Action:** if a rate changed, reconcile \`evmax/fees.py\`, then regenerate the snapshot:"
            echo '```'
            echo "uv run --with 'pypdf==6.15.0' scripts/check_kalshi_fees.py --update"
            echo '```'
            echo ""
            echo "Source: https://kalshi.com/docs/kalshi-fee-schedule.pdf"
            echo "Run log: ${RUN_URL}"
          } > fee-issue.md
          existing="$(gh issue list --state open --search "in:title ${title}" --json number --jq '.[0].number' || true)"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file fee-issue.md
          else
            gh issue create --title "${title}" --body-file fee-issue.md --label kalshi-fee-drift \
              || gh issue create --title "${title}" --body-file fee-issue.md
          fi

      - name: Note inconclusive check
        if: steps.check.outputs.verdict == 'inconclusive'
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: echo "::warning title=Kalshi fee watch inconclusive::${SUMMARY} — will retry next run."

      - name: Fail on drift
        if: steps.check.outputs.verdict == 'hard_drift' || steps.check.outputs.verdict == 'soft_drift'
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          echo "::error title=Kalshi fee schedule drift::${SUMMARY}"
          exit 1
