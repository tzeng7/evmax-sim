# PR / main CI.
#
# Security posture:
#   - `pull_request` trigger only (never `pull_request_target`) — fork PRs get a
#     read-only token and no secrets.
#   - Top-level `permissions: contents: read`; no job escalates.
#   - Every action pinned to a full commit SHA (tag in the comment) so a
#     hijacked tag can't inject code.
#   - `persist-credentials: false` on checkout — no ambient git token on disk.
#   - Job timeouts + per-ref concurrency cancellation bound runner usage.
#
# The pytest suite needs no .env / secrets (verified 2026-07-11: 2090 passed,
# 7 skipped, ~55s locally) and tests/conftest.py isolates all model-state
# writes to tmp dirs.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.7.17"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --extra dev

      - name: Validate category registry
        run: uv run evmax categories validate

      - name: Run test suite
        run: uv run pytest tests/ -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build
